#lc-preview .lc-surface a,#lc-preview .lc-surface button,#lc-preview .lc-surface summary{font:inherit;color:inherit}
#lc-preview .lc-surface a{text-decoration:none}
#lc-preview .lc-surface button{background:none;border:0;padding:0;text-align:left}
#lc-preview .lc-surface a:hover,#lc-preview .lc-contact-link:hover{text-decoration:underline;text-underline-offset:5px}
#lc-preview .lc-header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:26px 5%;border-bottom:1px solid var(--lc-rule)}
#lc-preview .lc-brand{font-size:18px!important;letter-spacing:.16em;white-space:nowrap}
#lc-preview .lc-brand span{display:block;font-size:11px;letter-spacing:.32em;margin-top:5px}
#lc-preview .lc-navigation{display:flex;align-items:center;gap:24px;font-size:12px}
#lc-preview .lc-shop{position:relative}
#lc-preview .lc-shop summary{list-style:none;padding:12px 0;color:var(--lc-soft)}
#lc-preview .lc-shop summary::-webkit-details-marker{display:none}
#lc-preview .lc-shop summary span{margin-left:5px}
#lc-preview .lc-shop&gt;div{position:absolute;right:0;top:100%;width:245px;padding:10px;background:var(--lc-paper);border:1px solid var(--lc-rule);z-index:2}
#lc-preview .lc-shop&gt;div&gt;a,#lc-preview .lc-shop&gt;div&gt;span{display:block;padding:12px;font-size:12px;line-height:1.6}
#lc-preview .lc-shop small{display:block;font-size:11px;color:var(--lc-soft);margin-top:5px}
#lc-preview .lc-surface .lc-toggle{display:none;align-items:center;justify-content:center;height:44px;width:44px}
#lc-preview .lc-toggle span{display:flex;align-items:center;justify-content:center}
#lc-preview .lc-toggle [hidden]{display:none!important}
#lc-preview .lc-container{width:90%;max-width:1800px;margin:auto}
#lc-preview .lc-back{display:inline-block;font-size:12px;color:var(--lc-soft);padding:12px 0;margin-top:27px}
#lc-preview .lc-eyebrow{font-size:11px!important;letter-spacing:.14em;line-height:1.6;color:var(--lc-soft)}
#lc-preview h1,#lc-preview h2{font-family:Georgia,&#x27;Times New Roman&#x27;,serif;font-weight:400;letter-spacing:-.025em;line-height:1.13;margin:0}
#lc-preview .lc-intro{padding:35px 0 38px}
#lc-preview .lc-intro h1{font-size:54px;margin:15px 0 23px}
#lc-preview .lc-story{max-width:78ch}
#lc-preview .lc-story p,#lc-preview .lc-night-story&gt;p:not(.lc-eyebrow){font-size:14px;line-height:1.9;color:var(--lc-soft)}
#lc-preview .lc-story p+p{margin-top:16px}
#lc-preview .lc-photo{display:block;width:100%}
#lc-preview .lc-photo img{display:block;width:100%;height:auto}
#lc-preview figcaption{font-size:11px;color:var(--lc-soft);padding-top:13px;line-height:1.6}
#lc-preview .lc-wide{margin:65px 0!important}
#lc-preview .lc-pair{display:grid;grid-template-columns:1fr 1fr;gap:46px;width:86%;max-width:960px;margin:65px auto}
#lc-preview .lc-single{max-width:440px;width:47%;margin:70px auto!important}
#lc-preview .lc-night{margin-top:80px}
#lc-preview .lc-night-story{max-width:78ch;margin-bottom:43px}
#lc-preview .lc-night-story h2{font-size:38px;margin:14px 0 23px}
#lc-preview .lc-mixed{display:grid;grid-template-columns:.52fr 1fr;gap:60px;align-items:center;width:90%;max-width:1250px;margin:0 auto 65px}
#lc-preview .lc-mixed figure:first-child{max-width:350px;width:100%}
#lc-preview .lc-lamps{max-width:380px;width:40%;margin-top:70px!important;margin-bottom:70px!important}
#lc-preview .lc-contact{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:65px;margin-top:65px;padding:55px 0 42px;border-top:1px solid var(--lc-rule)}
#lc-preview .lc-contact h2{font-size:30px;margin-top:15px;max-width:25ch}
#lc-preview .lc-contact&gt;div&gt;p:not(.lc-eyebrow){font-size:14px;line-height:1.8;color:var(--lc-soft);max-width:45ch}
#lc-preview .lc-surface .lc-contact-link{display:inline-block;font-size:13px;padding:10px 0;margin-top:15px;border-bottom:1px solid var(--lc-ink)}
#lc-preview .lc-more{padding:25px 0 50px}
#lc-preview .lc-more&gt;div{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:14px}
#lc-preview .lc-more button{display:flex;justify-content:space-between;align-items:center;gap:15px;width:100%;padding:22px 0;border-top:1px solid var(--lc-rule);font:23px Georgia,serif}
#lc-preview .lc-more button span{font:14px Arial,sans-serif}
#lc-preview .lc-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--lc-rule);padding:24px 5%;font-size:11px;color:var(--lc-soft)}
#lc-preview .lc-page[hidden],#lc-preview .lc-viewer[hidden],#lc-preview .lc-feedback[hidden]{display:none}
#lc-preview .lc-viewer{padding:30px 5%}
#lc-preview .lc-viewer header{display:flex;align-items:center;justify-content:space-between;gap:25px;padding-bottom:24px}
#lc-preview .lc-viewer h2{font-size:29px;margin-top:9px}
#lc-preview .lc-surface .lc-return{font-size:12px;padding:14px 0}
#lc-preview .lc-viewer-photo img{display:block;max-width:100%;max-height:540px;width:auto;height:auto;object-fit:contain;margin:auto}
#lc-preview .lc-viewer-controls{display:flex;justify-content:center;align-items:center;gap:23px;margin-top:19px;font-size:12px;color:var(--lc-soft)}
#lc-preview .lc-viewer-controls button{height:44px;width:44px;text-align:center;font-size:23px}
#lc-preview .lc-viewer-location{text-align:center;color:var(--lc-soft);font-size:11px;margin-top:6px!important}
#lc-preview .lc-feedback{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:12px;font-size:13px}
#lc-preview[data-device=&quot;mobile&quot;] .lc-surface{max-width:390px}
#lc-preview[data-device=&quot;mobile&quot;] .lc-header{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:17px 22px}
#lc-preview[data-device=&quot;mobile&quot;] .lc-brand{font-size:16px!important}
#lc-preview[data-device=&quot;mobile&quot;] .lc-brand span{font-size:11px;letter-spacing:.25em}
#lc-preview[data-device=&quot;mobile&quot;] .lc-toggle{display:flex}

#lc-preview[data-device=&quot;mobile&quot;] .lc-night-story{margin-bottom:30px}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;lc-preview&#x27;);
  const assets = JSON.parse(document.getElementById(&#x27;lc-assets&#x27;).textContent);
  const images = [...root.querySelectorAll(&#x27;[data-lc-photo]&#x27;)];
  const works = images.map(img =&gt; ({key:img.dataset.lcPhoto,alt:img.alt}));
  images.forEach(img =&gt; {const asset=assets[img.dataset.lcPhoto];img.src=asset.src;img.width=asset.width;img.height=asset.height;});
  const page=root.querySelector(&#x27;.lc-page&#x27;);const viewer=root.querySelector(&#x27;.lc-viewer&#x27;);const viewerImage=viewer.querySelector(&#x27;img&#x27;);const close=root.querySelector(&#x27;[data-lc-close]&#x27;);const feedback=root.querySelector(&#x27;.lc-feedback&#x27;);
  let selected=0;let opener;let savedScroll=0;
  function display(){const work=works[selected];const asset=assets[work.key];viewerImage.src=asset.src;viewerImage.alt=work.alt;viewerImage.width=asset.width;viewerImage.height=asset.height;viewer.querySelector(&#x27;.lc-viewer-controls span&#x27;).textContent=`${selected+1} / ${works.length}`;}
  function closeViewer(){if(viewer.hidden)return;viewer.hidden=true;page.hidden=false;if(opener)opener.focus({preventScroll:true});window.scrollTo({top:savedScroll,behavior:&#x27;instant&#x27;});if(opener)opener.scrollIntoView({block:&#x27;nearest&#x27;,behavior:&#x27;instant&#x27;});}
  root.querySelectorAll(&#x27;[data-lc-open]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{opener=button;savedScroll=window.scrollY;selected=Number(button.dataset.lcOpen);display();page.hidden=true;viewer.hidden=false;feedback.hidden=true;root.scrollIntoView({block:&#x27;start&#x27;,behavior:&#x27;instant&#x27;});close.focus({preventScroll:true});}));
  close.addEventListener(&#x27;click&#x27;,closeViewer);
  function step(amount){selected=(selected+amount+works.length)%works.length;display();}
  root.querySelectorAll(&#x27;[data-lc-step]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;step(Number(button.dataset.lcStep))));
  const toggle=root.querySelector(&#x27;.lc-toggle&#x27;);const shop=root.querySelector(&#x27;.lc-shop&#x27;);
  function menu(open,restoreFocus=false){root.dataset.menuOpen=String(open);toggle.setAttribute(&#x27;aria-expanded&#x27;,String(open));toggle.setAttribute(&#x27;aria-label&#x27;,open?&#x27;Cerrar menú&#x27;:&#x27;Abrir menú&#x27;);root.querySelector(&#x27;[data-lc-menu-icon]&#x27;).hidden=open;root.querySelector(&#x27;[data-lc-close-icon]&#x27;).hidden=!open;if(!open)shop.open=false;if(restoreFocus)toggle.focus({preventScroll:true});}
  toggle.addEventListener(&#x27;click&#x27;,()=&gt;menu(root.dataset.menuOpen!==&#x27;true&#x27;));
  root.addEventListener(&#x27;keydown&#x27;,event=&gt;{if(!viewer.hidden){if(event.key===&#x27;Escape&#x27;){event.preventDefault();closeViewer();}if(event.key===&#x27;ArrowLeft&#x27;||event.key===&#x27;ArrowRight&#x27;){event.preventDefault();step(event.key===&#x27;ArrowRight&#x27;?1:-1);}return;}if(event.key===&#x27;Escape&#x27;){if(root.dataset.menuOpen===&#x27;true&#x27;){event.preventDefault();menu(false,true);}else if(shop.open){event.preventDefault();shop.open=false;shop.querySelector(&#x27;summary&#x27;).focus();}}});
  root.addEventListener(&#x27;pointerdown&#x27;,event=&gt;{if(!root.querySelector(&#x27;.lc-header&#x27;).contains(event.target))menu(false);});
  root.querySelectorAll(&#x27;[data-lc-device]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{menu(false);root.dataset.device=button.dataset.lcDevice;root.querySelectorAll(&#x27;[data-lc-device]&#x27;).forEach(other=&gt;{const active=other===button;other.setAttribute(&#x27;aria-pressed&#x27;,String(active));other.classList.toggle(&#x27;btn-primary&#x27;,active);});}));
  root.querySelector(&#x27;[data-lc-contact-nav]&#x27;).addEventListener(&#x27;click&#x27;,event=&gt;{event.preventDefault();menu(false);root.querySelector(&#x27;#lc-contact&#x27;).scrollIntoView({block:&#x27;start&#x27;,behavior:&#x27;instant&#x27;});});
  root.querySelectorAll(&#x27;[data-lc-link]&#x27;).forEach(link=&gt;link.addEventListener(&#x27;click&#x27;,event=&gt;{event.preventDefault();menu(false);feedback.querySelector(&#x27;span&#x27;).textContent=`${link.dataset.lcLink} · Este acceso representa la navegación de la web.`;feedback.hidden=false;feedback.scrollIntoView({block:&#x27;nearest&#x27;,behavior:&#x27;instant&#x27;});}));
  root.querySelector(&#x27;[data-lc-dismiss]&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{feedback.hidden=true;});
})();

    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
