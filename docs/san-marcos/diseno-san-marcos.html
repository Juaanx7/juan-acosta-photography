(() =&gt; {
  const root = document.getElementById(&#x27;sm-serie-preview&#x27;);
  const assets = JSON.parse(document.getElementById(&#x27;sm-serie-assets&#x27;).textContent);
  root.querySelectorAll(&#x27;[data-sm-photo]&#x27;).forEach(img =&gt; { img.src = assets[img.dataset.smPhoto]; });
  const works = [
    { key: &#x27;pueblo&#x27;, title: &#x27;Pueblo serrano&#x27;, alt: &#x27;San Marcos Sierras entre los árboles, bajo un cielo de atardecer&#x27; },
    { key: &#x27;camino&#x27;, title: &#x27;Camino al atardecer&#x27;, alt: &#x27;El sol entre las ramas ilumina el paisaje y un camino en la ladera&#x27; },
    { key: &#x27;calles&#x27;, title: &#x27;Calles de infancia&#x27;, alt: &#x27;Una calle de tierra y una pequeña figura en bicicleta entre la luz y la sombra de los árboles&#x27; },
    { key: &#x27;pasarela&#x27;, title: &#x27;Última luz&#x27;, alt: &#x27;La silueta de un caminante cruza una pasarela frente al cielo del atardecer&#x27; },
    { key: &#x27;reflejos&#x27;, title: &#x27;Reflejos&#x27;, alt: &#x27;Tres siluetas cruzan una pasarela y se reflejan en el agua bajo un cielo dorado&#x27; },
    { key: &#x27;cielo&#x27;, title: &#x27;El cielo del pueblo&#x27;, alt: &#x27;El cielo estrellado sobre la pasarela y los árboles iluminados del pueblo&#x27; }
  ];
  const page = root.querySelector(&#x27;.sm-page&#x27;);
  const viewer = root.querySelector(&#x27;.sm-viewer&#x27;);
  const image = viewer.querySelector(&#x27;img&#x27;);
  let selected = 0;
  let opener;
  let savedScroll = 0;
  function display() {
    const work = works[selected];
    image.src = assets[work.key];
    image.alt = work.alt;
    root.querySelector(&#x27;#sm-viewer-heading&#x27;).textContent = work.title;
    viewer.querySelector(&#x27;.sm-viewer-controls span&#x27;).textContent = `${selected + 1} / ${works.length}`;
  }
  root.querySelectorAll(&#x27;[data-sm-open]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    opener = button;
    savedScroll = window.scrollY;
    selected = Number(button.dataset.smOpen);
    display();
    page.hidden = true;
    viewer.hidden = false;
    root.querySelector(&#x27;.sm-preview-message&#x27;).hidden = true;
    root.scrollIntoView({ block: &#x27;start&#x27;, behavior: &#x27;instant&#x27; });
    viewer.querySelector(&#x27;[data-sm-close]&#x27;).focus({ preventScroll: true });
  }));
  function closeViewer() {
    if (viewer.hidden) return;
    viewer.hidden = true;
    page.hidden = false;
    if (opener) opener.focus({ preventScroll: true });
    window.scrollTo({ top: savedScroll, behavior: &#x27;instant&#x27; });
    if (opener) opener.scrollIntoView({ block: &#x27;nearest&#x27;, behavior: &#x27;instant&#x27; });
  }
  root.querySelector(&#x27;[data-sm-close]&#x27;).addEventListener(&#x27;click&#x27;, closeViewer);
  root.querySelectorAll(&#x27;[data-sm-step]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    selected = (selected + Number(button.dataset.smStep) + works.length) % works.length;
    display();
  }));
  root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
    if (viewer.hidden) return;
    if (event.key === &#x27;Escape&#x27;) { event.preventDefault(); closeViewer(); }
    if (event.key === &#x27;ArrowLeft&#x27; || event.key === &#x27;ArrowRight&#x27;) {
      event.preventDefault(); selected = (selected + (event.key === &#x27;ArrowRight&#x27; ? 1 : -1) + works.length) % works.length; display();
    }
  });
  root.querySelectorAll(&#x27;[data-sm-device]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.dataset.device = button.dataset.smDevice;
    root.querySelectorAll(&#x27;[data-sm-device]&#x27;).forEach(other =&gt; {
      const current = other === button;
      other.setAttribute(&#x27;aria-pressed&#x27;, String(current));
      other.classList.toggle(&#x27;btn-primary&#x27;, current);
    });
  }));
  const feedback = root.querySelector(&#x27;.sm-preview-message&#x27;);
  root.querySelectorAll(&#x27;[data-sm-link]&#x27;).forEach(link =&gt; link.addEventListener(&#x27;click&#x27;, event =&gt; {
    event.preventDefault();
    feedback.querySelector(&#x27;span&#x27;).textContent = `${link.dataset.smLink} · Navegación pendiente de implementación.`;
    feedback.hidden = false;
    root.querySelectorAll(&#x27;.sm-shop&#x27;).forEach(shop =&gt; { shop.open = false; });
    feedback.scrollIntoView({ block: &#x27;nearest&#x27;, behavior: &#x27;instant&#x27; });
  }));
  root.querySelector(&#x27;[data-sm-dismiss]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { feedback.hidden = true; });
})();

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;

    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }

    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),

      ids.add(tooltipId);

    }

  };

    clearOpenTimeout();

    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),

        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,

  );
  delete frame.dataset.srcdoc;
})();
</script>
