&lt;style&gt;
#achala-preview .ac-surface{--ac-paper:#fcfbf8;--ac-ink:#25251f;--ac-soft:#696960;--ac-rule:#deded5;background:var(--ac-paper);color:var(--ac-ink);font-family:Arial,Helvetica,sans-serif;width:100%;margin:0 auto}
#achala-preview .ac-surface *{box-sizing:border-box;min-width:0}
#achala-preview .ac-surface p,#achala-preview .ac-surface figure{margin:0}
#achala-preview .ac-surface button,#achala-preview .ac-surface a,#achala-preview .ac-surface summary{font:inherit;color:inherit}
#achala-preview .ac-surface button{background:none;border:0;padding:0;text-align:left}
#achala-preview .ac-surface a{text-decoration:none}
#achala-preview .ac-surface a:hover,#achala-preview .ac-enlarge:hover,#achala-preview .ac-contact:hover{text-decoration:underline;text-underline-offset:5px}
#achala-preview .ac-nav{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:26px 38px;border-bottom:1px solid var(--ac-rule)}
#achala-preview .ac-brand{font-size:18px!important;letter-spacing:.16em;white-space:nowrap}
#achala-preview .ac-brand span{display:block;font-size:11px;letter-spacing:.32em;margin-top:5px}
#achala-preview .ac-nav nav{display:flex;align-items:center;gap:23px;font-size:12px}
#achala-preview .ac-shop{position:relative}
#achala-preview .ac-shop summary{list-style:none;padding:12px 0;color:var(--ac-soft)}
#achala-preview .ac-shop summary::-webkit-details-marker{display:none}
#achala-preview .ac-shop&gt;div{position:absolute;right:0;top:100%;width:250px;max-width:calc(100vw - 36px);padding:10px;background:var(--ac-paper);border:1px solid var(--ac-rule);z-index:3}
#achala-preview .ac-shop button,#achala-preview .ac-shop&gt;div&gt;span{display:block;padding:12px;font-size:12px;line-height:1.6}
#achala-preview .ac-shop small{display:block;font-size:11px;color:var(--ac-soft)}
#achala-preview .ac-container{max-width:1080px;margin:auto;padding:0 48px}
#achala-preview .ac-back{display:inline-block;padding:10px 0;margin-top:29px;font-size:12px;color:var(--ac-soft)}
#achala-preview .ac-eyebrow{font-size:11px!important;letter-spacing:.14em;line-height:1.6;color:var(--ac-soft)}
#achala-preview h1,#achala-preview h2{font-family:Georgia,&#x27;Times New Roman&#x27;,serif;font-weight:400;letter-spacing:-.025em;line-height:1.12;margin:0}
#achala-preview .ac-intro{display:grid;grid-template-columns:1fr 1.15fr;gap:55px;padding:38px 0 42px;align-items:start}
#achala-preview .ac-intro h1{font-size:54px;margin-top:15px}
#achala-preview .ac-story p{font-size:13px;line-height:1.95;color:var(--ac-soft)}
#achala-preview .ac-story p+p{margin-top:17px}
#achala-preview .ac-photo{display:block;width:100%}
#achala-preview .ac-photo img{display:block;width:100%;height:auto}
#achala-preview figcaption{display:flex;justify-content:flex-end;gap:15px;align-items:center;padding-top:9px;min-height:44px;font-size:11px;color:var(--ac-soft)}
#achala-preview figcaption&gt;span{margin-right:auto}
#achala-preview .ac-surface .ac-enlarge{font-size:11px;padding:9px 0;min-height:36px;white-space:nowrap;color:var(--ac-soft)}
#achala-preview .ac-pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:56px auto}
#achala-preview .ac-verticals{max-width:720px;gap:44px;margin-top:68px;margin-bottom:68px}
#achala-preview .ac-wide{margin:62px auto!important}
#achala-preview .ac-medium{max-width:820px}
#achala-preview .ac-return{display:grid;grid-template-columns:.8fr 1fr;gap:78px;max-width:820px;align-items:center;margin:80px auto 64px}
#achala-preview .ac-return figure{max-width:300px}
#achala-preview .ac-return h2{font-size:38px;margin-top:15px}
#achala-preview .ac-return-story{font-size:13px;line-height:1.95;color:var(--ac-soft);margin-top:24px!important}
#achala-preview .ac-golden figure+figure{margin-top:45px}
#achala-preview .ac-closing{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;padding:60px 0 45px;margin-top:55px;border-top:1px solid var(--ac-rule)}
#achala-preview .ac-closing h2{font-size:30px;margin-top:15px}
#achala-preview .ac-closing&gt;div&gt;p:not(.ac-eyebrow){font-size:13px;line-height:1.8;color:var(--ac-soft);max-width:330px}
#achala-preview .ac-surface .ac-contact{font-size:13px;padding:10px 0;margin-top:13px;border-bottom:1px solid var(--ac-ink)}
#achala-preview .ac-more{padding:25px 0 50px}
#achala-preview .ac-more&gt;div{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:14px}
#achala-preview .ac-more button{display:flex;justify-content:space-between;align-items:center;gap:15px;width:100%;border-top:1px solid var(--ac-rule);padding:22px 0;font:23px Georgia,serif}
#achala-preview .ac-more button span{font:14px Arial,Helvetica,sans-serif}
#achala-preview .ac-footer{border-top:1px solid var(--ac-rule);padding:23px 38px;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;color:var(--ac-soft)}
#achala-preview .ac-footer&gt;div{display:flex;gap:22px;align-items:center}
#achala-preview .ac-page[hidden],#achala-preview .ac-viewer[hidden],#achala-preview .ac-feedback[hidden]{display:none}
#achala-preview .ac-viewer{padding:30px 36px}
#achala-preview .ac-viewer header{display:flex;align-items:center;justify-content:space-between;gap:25px;padding-bottom:24px}
#achala-preview .ac-viewer h2{font-size:29px;margin-top:9px}
#achala-preview .ac-surface .ac-close{font-size:12px;padding:14px 0}
#achala-preview .ac-viewer-photo img{display:block;max-width:100%;width:auto;height:auto;max-height:540px;object-fit:contain;margin:auto}
#achala-preview .ac-viewer-controls{display:flex;justify-content:center;align-items:center;gap:23px;margin-top:19px;font-size:12px;color:var(--ac-soft)}
#achala-preview .ac-viewer-controls button{height:44px;width:44px;text-align:center;font-size:23px}
#achala-preview .ac-viewer-location{font-size:11px;color:var(--ac-soft);text-align:center;margin-top:6px!important}
#achala-preview .ac-feedback{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;font-size:13px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-surface{max-width:390px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-nav{display:block;padding:20px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-nav nav{margin-top:17px;gap:18px;flex-wrap:wrap;font-size:11px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-container{padding-left:22px;padding-right:22px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-intro{grid-template-columns:1fr;gap:25px;padding:23px 0 30px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-intro h1{font-size:41px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-story p,#achala-preview[data-device=&quot;mobile&quot;] .ac-return-story{font-size:14px;line-height:1.85}
#achala-preview[data-device=&quot;mobile&quot;] .ac-pair{grid-template-columns:1fr;gap:26px;margin:36px auto}
#achala-preview[data-device=&quot;mobile&quot;] .ac-verticals{max-width:280px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-wide{margin:38px auto!important}
#achala-preview[data-device=&quot;mobile&quot;] .ac-return{grid-template-columns:1fr;gap:28px;margin:45px auto 38px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-return figure{max-width:280px;margin:auto}
#achala-preview[data-device=&quot;mobile&quot;] .ac-return h2{font-size:34px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-golden figure+figure{margin-top:27px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-closing{grid-template-columns:1fr;gap:24px;padding:35px 0 25px;margin-top:35px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-more{padding-top:23px;padding-bottom:25px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-more&gt;div{grid-template-columns:1fr;gap:0}
#achala-preview[data-device=&quot;mobile&quot;] .ac-footer{padding:22px;flex-wrap:wrap}
#achala-preview[data-device=&quot;mobile&quot;] .ac-viewer{padding:22px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-viewer header{display:block}
#achala-preview[data-device=&quot;mobile&quot;] .ac-viewer h2{font-size:25px}
#achala-preview[data-device=&quot;mobile&quot;] .ac-viewer-photo img{max-height:470px}
@media(max-width:580px){#achala-preview .ac-nav{display:block;padding:20px}#achala-preview .ac-nav nav{margin-top:17px;gap:18px;flex-wrap:wrap;font-size:11px}#achala-preview .ac-container{padding:0 22px}#achala-preview .ac-intro{grid-template-columns:1fr;gap:25px;padding:23px 0 30px}#achala-preview .ac-intro h1{font-size:41px}#achala-preview .ac-story p,#achala-preview .ac-return-story{font-size:14px;line-height:1.85}#achala-preview .ac-pair{grid-template-columns:1fr;gap:26px;margin:36px auto}#achala-preview .ac-verticals{max-width:280px}#achala-preview .ac-wide{margin:38px auto!important}#achala-preview .ac-return{grid-template-columns:1fr;gap:28px;margin:45px auto 38px}#achala-preview .ac-return figure{max-width:280px;margin:auto}#achala-preview .ac-return h2{font-size:34px}#achala-preview .ac-golden figure+figure{margin-top:27px}#achala-preview .ac-closing{grid-template-columns:1fr;gap:24px;padding:35px 0 25px;margin-top:35px}#achala-preview .ac-more{padding:23px 0 25px}#achala-preview .ac-more&gt;div{grid-template-columns:1fr;gap:0}#achala-preview .ac-footer{padding:22px;flex-wrap:wrap}#achala-preview .ac-viewer{padding:22px}#achala-preview .ac-viewer header{display:block}#achala-preview .ac-viewer h2{font-size:25px}#achala-preview .ac-viewer-photo img{max-height:470px}}

(() =&gt; {
  const root = document.getElementById(&#x27;achala-preview&#x27;);
  const assets = JSON.parse(document.getElementById(&#x27;achala-assets&#x27;).textContent);
  const photoElements = [...root.querySelectorAll(&#x27;[data-ac-photo]&#x27;)];
  const works = photoElements.map(img =&gt; ({ key: img.dataset.acPhoto, alt: img.alt }));
  photoElements.forEach(img =&gt; { const asset = assets[img.dataset.acPhoto]; img.src = asset.src; img.width = asset.width; img.height = asset.height; });
  const page = root.querySelector(&#x27;.ac-page&#x27;);
  const viewer = root.querySelector(&#x27;.ac-viewer&#x27;);
  const viewerImage = viewer.querySelector(&#x27;img&#x27;);
  const counter = viewer.querySelector(&#x27;.ac-viewer-controls span&#x27;);
  const closeButton = root.querySelector(&#x27;[data-ac-close]&#x27;);
  const feedback = root.querySelector(&#x27;.ac-feedback&#x27;);
  let selected = 0;
  let opener;
  let savedScroll = 0;
  function display() {
    const work = works[selected];
    const asset = assets[work.key];
    viewerImage.src = asset.src; viewerImage.alt = work.alt;
    viewerImage.width = asset.width; viewerImage.height = asset.height;
    counter.textContent = `${selected + 1} / ${works.length}`;
  }
  root.querySelectorAll(&#x27;[data-ac-open]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
